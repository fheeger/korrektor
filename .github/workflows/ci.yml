name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # `build` runs compile, all tests and ktlint (format and lint checks).
      # Tests that need the sample PDF skip themselves when it's missing.
      - run: ./gradlew build
