name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # `build` runs compile, all tests, ktlint (format and lint checks) and Detekt (complexity and code smells).
      # Tests that need the sample PDF must skip themselves when it's missing.
      # --continue: a Detekt finding must not hide failing tests, and the reports are still written.
      - run: ./gradlew build koverXmlReport --continue
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: build/reports
          if-no-files-found: ignore
